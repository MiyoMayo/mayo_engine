name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
      - name: Ninjaを用意
        run: brew install ninja
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
  tests:
    name: tests
    runs-on: macos-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
      - name: Ninjaを用意
        run: brew install ninja
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: CTest
        run: ctest --preset dev
  tidy:
    name: tidy
    runs-on: macos-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
      - name: NinjaとLLVMを用意
        run: brew install ninja llvm
      - name: clang-tidyをPATHに追加
        run: echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: Configure
        run: cmake --preset tidy
      - name: Build
        run: cmake --build --preset tidy
